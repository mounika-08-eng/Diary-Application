<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feed Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./feedpage.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body >
    <div class=" text-end p-2">
      <a  class="btn btn-primary w-25" href="./post.html">New Post</a>
    <a class="btn btn-danger w-25"
   href="./login.html"
   onclick="logoutUser(event)">
   Logout
</a>
    </div>
    <div class="all" id="allPosts">
        
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
<script>
  
async function loadPosts() {
    const allPosts = document.getElementById('allPosts');
    const userID = localStorage.getItem('userID');

    if (!userID) {
        window.location.href = './login.html';
        return;
    }

    try {
        const response = await fetch(
            `http://localhost:3000/userPosts/${userID}`
        );

        if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
        }

        const posts = await response.json();

        console.log('Logged-in user ID:', userID);
        console.log('Posts received from server:', posts);

        allPosts.replaceChildren();

        if (posts.length === 0) {
            allPosts.textContent =
                'No diary posts yet. Create your first post!';
            return;
        }

       
posts.forEach(post => {
    const postDiv = document.createElement('div');
    postDiv.className = 'diary-card';

    const title = document.createElement('h2');
    title.textContent = post.postTitle;

    const description = document.createElement('p');
    description.className = 'post-preview';

    // Show only a short preview on the feed page
    const maxLength = 150;
    description.textContent =
        post.postDescription.length > maxLength
            ? post.postDescription.substring(0, maxLength) + '...'
            : post.postDescription;

    const viewButton = document.createElement('a');
    viewButton.className = 'btn viewPostButton';
    viewButton.textContent = 'View Post';
    viewButton.href =
        `./dedicated.html?id=${encodeURIComponent(post.ID)}`;

    postDiv.append(title, description, viewButton);
    allPosts.appendChild(postDiv);
});


    } catch (error) {
        console.error('Error loading posts:', error);
        allPosts.textContent =
            'Unable to load your posts. Please try again later.';
    }
}

loadPosts();

  
</script>
<script>
    function logoutUser(event) {
        event.preventDefault();

        // Clear the logged-in user's information
        localStorage.removeItem('userID');
        localStorage.removeItem('email');

        // Return to the login page
        window.location.replace('./login.html');
    }
</script>
  </body>
</html>
